# MapleDividends: refresh dividend data from SEC EDGAR and deploy the static site to Cloudflare Pages.
# Free: public repo => GitHub-hosted runner minutes are free; Cloudflare Pages free plan.
# Required repo secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID
# Optional repo variables: SEC_UA (contact string SEC requires; defaults below), CF_BEACON_TOKEN (Cloudflare Web Analytics)
name: build-and-deploy
on:
  schedule:
    - cron: "17 11 * * *"   # 04:17 PDT / 03:17 PST
    - cron: "32 12 * * *"   # 05:32 PDT / 04:32 PST
    - cron: "17 23 * * *"   # 16:17 PDT / 15:17 PST
    - cron: "32 0 * * *"    # 17:32 PDT / 16:32 PST
  workflow_dispatch: {}
  push:
    branches: [main]
concurrency:
  group: build-and-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SEC_UA: ${{ vars.SEC_UA || 'MapleDividends admin@mapledividends.com' }}
      SITE_URL: https://mapledividends.com
      CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      TZ: America/Vancouver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poppler (pdftotext for PDF exhibits)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Restore EDGAR cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: edgar-cache-${{ github.run_id }}
          restore-keys: edgar-cache-
      - name: Build (full EDGAR fetch + parse + site)
        run: ./build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set; skipping deploy (build succeeded)."
            exit 0
          fi
          npx --yes wrangler@3 pages deploy dist --project-name=mapledividends --branch=main
